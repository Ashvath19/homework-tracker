<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homework Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homework">
  <meta name="theme-color" content="#2747d0">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="brand"><span class="hl">Homework</span></h1>
      <nav>
        <a href="#/" class="nav-link" data-route="/">Dashboard</a>
        <div class="nav-section">
          <span>Classes</span>
          <button class="icon-btn" data-action="new-class" title="Add class">+</button>
        </div>
        <div id="class-list"></div>
      </nav>
      <div class="sidebar-footer">
        <a href="#/settings" class="nav-link" data-route="/settings">Settings</a>
        <span id="sync-status" class="sync-status"></span>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </aside>

    <main id="main"></main>
    <aside id="cal" class="cal-panel" aria-label="Calendar" hidden></aside>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <!-- Homework details -->
  <dialog id="detail-dialog" class="detail" aria-label="Homework details">
    <div id="detail-body"></div>
  </dialog>

  <!-- Edit homework -->
  <dialog id="task-dialog">
    <form method="dialog" id="task-form">
      <h2>Edit homework</h2>
      <label>Title <input name="title" required></label>
      <label>Class <select name="classId"></select></label>
      <label>Type <select name="tag"></select></label>
      <label>Due date <input type="date" name="due"></label>
      <label>Notes <textarea name="notes" rows="4" placeholder="Pages, problems, links…"></textarea></label>
      <a id="task-link" target="_blank" rel="noopener" hidden>Open in Moodle</a>
      <div class="dialog-actions">
        <button type="button" class="danger" data-action="delete-task">Delete</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Add / edit class -->
  <dialog id="class-dialog">
    <form method="dialog" id="class-form">
      <h2 id="class-dialog-title">New class</h2>
      <label>Name <input name="name" required placeholder="e.g. AP Chemistry"></label>
      <label id="class-day-row" hidden>Meets on
        <select name="day">
          <option value="">Not set</option>
          <option value="A">A days</option>
          <option value="B">B days</option>
        </select>
      </label>
      <fieldset>
        <legend>Color</legend>
        <div id="color-swatches" class="swatches"></div>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="danger" data-action="delete-class">Delete class</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
