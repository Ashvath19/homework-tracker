name: Check Moodle

# Backup only. cron-job.org calls /api/sync every 2 hours; GitHub often skips scheduled runs,
# so it can't be the main scheduler. The site ignores any call within ~2 hours of the last one,
# so this never doubles up. Each run also sends the 6pm reminder once it's 6pm or later.
on:
  schedule:
    - cron: '37 */2 * * *' # every 2 hours
  workflow_dispatch: # running it by hand always checks, even if the site checked recently

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: "${{ github.event_name == 'workflow_dispatch' && '&force=1' || '' }}"
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/sync?mode=sync$FORCE"
